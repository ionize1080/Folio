name: Publish verified Folio 1.2 RC1-P6
on:
  push:
    branches: [codex/release-1.2-rc1-p6]
    paths: [.github/workflows/release-rc1-p6.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: folio-release-v1.2.0-rc1-p6
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ionize1080/Folio
    steps:
      - name: Download exact successful Windows build
        shell: python
        run: |
          import json,subprocess
          repo='ionize1080/Folio';run=35818217755;sha='0b1cfa0cfb685f8d8bbd5ee04b0042574a85a8d5'
          result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          assert result['status']=='completed' and result['conclusion']=='success'
          assert result['head_sha']==sha and result['path']=='.github/workflows/folio-editor-p6.yml'
          artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))['artifacts']
          for name in ['folio-p6-portable','folio-p6-source','folio-p6-windows-validation']:
              matches=[a for a in artifacts if a['name']==name and not a['expired']]
              assert len(matches)==1,name
              subprocess.run(['gh','run','download',str(run),'--name',name,'--dir','download/'+name],check=True)
      - name: Verify tested binaries and stage attachments
        shell: python
        run: |
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          src=Path('download');out=Path('release');out.mkdir();prefix='Folio-PDF-Studio-1.2.0-RC1-P6'
          portable=src/'folio-p6-portable'/f'{prefix}-win-x64.zip';source=src/'folio-p6-source'/f'{prefix}-source.zip'
          validation=src/'folio-p6-windows-validation'
          reports={name:json.loads((validation/file).read_text(encoding='utf-8')) for name,file in {
              'packagedEditor':'p6-electron-report.json','packagedP5':'p5-electron-report.json',
              'packagedNarrowTable':'p4-electron-report.json','packagedExistingFeatures':'v12-electron-report.json',
              'nativeEditor':'p6-native-report.json','nativeP5':'p5-native-report.json',
              'publicCorpus':'p6-corpus-report.json','previousPublicCorpus':'p5-corpus-report.json'}.items()}
          for name,r in reports.items():assert not r['errors'],name
          packaged=['packagedEditor','packagedP5','packagedNarrowTable','packagedExistingFeatures']
          for name in packaged:assert reports[name]['platform']=='win32',name
          assert len(reports['packagedEditor']['checks'])>=4
          assert len(reports['packagedEditor']['fontResults'])>=100
          assert all(f['status']=='loaded' and f['advances']>0 for f in reports['packagedEditor']['fontResults'])
          assert len(reports['nativeEditor']['checks'])>=13
          assert reports['publicCorpus']['pages']==50 and len(reports['publicCorpus']['documents'])==10
          assert reports['previousPublicCorpus']['pages']==23
          with zipfile.ZipFile(portable) as z:
              assert z.testzip() is None
              for internal,field in [('Folio-PDF-Studio/resources/app.asar','asar_sha256'),('Folio-PDF-Studio/Folio.exe','exe_sha256')]:
                  with z.open(internal) as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
                  for name in packaged:assert digest==reports[name][field],(name,field)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              p=json.loads(z.read('Folio-PDF-Studio-source/package.json'))
              assert p['version']=='1.2.0' and p['releaseChannel']=='rc1-p6'
              assert 'Folio-PDF-Studio-source/docs/RC1-P6-editor-audit.md' in z.namelist()
              assert not any('/tests/output/' in n or '/.venv/' in n or '/.corpus-seed/' in n for n in z.namelist())
          shutil.copyfile(portable,out/f'{prefix}-portable-win-x64.zip');shutil.copyfile(source,out/source.name)
          results={'sourceCommit':'0b1cfa0cfb685f8d8bbd5ee04b0042574a85a8d5','windowsRun':'https://github.com/ionize1080/Folio/actions/runs/35818217755',**reports}
          (out/f'{prefix}-validation.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          hashes=[]
          for f in sorted(out.iterdir()):
              with f.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
              hashes.append(f'{digest}  {f.name}')
          (out/f'{prefix}-SHA256.txt').write_text('\n'.join(hashes)+'\n',encoding='utf-8')
          notes='''## 编辑修复
          - 新增默认非阻断的边界、重叠和页外内容通知；继续输入、选择、撤销和保存，详情按需展开，完成编辑后保留查看入口。编辑时页外文字和光标可见，导出仍保持原纸张大小。
          - 使用字体原始分数字宽，局部修改优先保留其他行字位；修复代码片段顺序、表格跨格对象误归属和过小单元格无入口。
          - 恢复 MingLiU、缺 name/空 OS2、Type1、raw CID CFF 等嵌入字体；保留真实粗斜体标识，修复零宽重音、emoji 和连字符语义；修复 CID 导出实际字形与 fi/fl 原连字叠印，增加双引擎墨迹检查。
          - 字体推荐改为有界单字形缓存并过滤过期响应；实际目录检查确认返回有效候选。
          - 修改页单独预览，保存时完整合成；修复深层对象递归失败和非零 CropBox 坐标，保留原页面框和旋转。

          ## 验证
          127 项 JavaScript 单元测试、P6 原生 13 项专项和完整旧版本原生/界面回归通过。
          Windows 上检查 10 份公开文档的 50 个抽样页，并在打包后的 Folio.exe 中加载全部可解析字体；实际验证页外持续编辑与保存、非阻断通知、CropBox、中英文年报和 SDK 修改保存重开。
          本地另完成 13 份文档 65 页界面复验，累计含复测 2111 个操作检查点；65 页保存重开，260 个未修改页面像素一致。最终样本中 43/65 没有超过 1 pt 的未改字符字位移动，其余存在局部或段落重排。58/65 页重开后完整目标仍在单个编辑块内，7 页仍发生段落拆分；保留词间空白的完整目标检查为 51/65，保留换行的逐字检查为 48/65；5 个复杂混排用例保留草稿并提示能力限制。
          5 份完整原件（194 至 2696 页）新增文本框写回通过；这不是全书逐页编辑测试。
          Windows 验收：https://github.com/ionize1080/Folio/actions/runs/35818217755
          源码审计与限制：https://github.com/ionize1080/Folio/blob/0b1cfa0cfb685f8d8bbd5ee04b0042574a85a8d5/docs/RC1-P6-editor-audit.md

          ## 下载与边界
          完整解压 portable-win-x64.zip，运行 Folio.exe；无需额外安装 Python、Node 或 OCR 模型。
          source.zip 包含源码与离线资源，validation.json 和 SHA256.txt 用于核验。
          此版本为预发布。任意扩写不能保证所有原字位不变；旋转文本的复杂字形、复杂字符合成粗斜体、Type3、部分特殊编码/阅读方向及非 1 UserUnit 仍有限制。几何提示非阻断，内容归属或字位完整性校验继续生效并保留草稿。
          '''
          Path('release-notes.md').write_text('\n'.join(line.lstrip() for line in notes.splitlines())+'\n',encoding='utf-8')
      - name: Publish source and tested portable build
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.0-rc1-p6 release/* --target 0b1cfa0cfb685f8d8bbd5ee04b0042574a85a8d5 --title 'Folio PDF Studio 1.2.0 RC1-P6' --notes-file release-notes.md --draft --prerelease
          gh release edit v1.2.0-rc1-p6 --draft=false --prerelease
