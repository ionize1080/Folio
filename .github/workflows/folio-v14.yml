name: Folio 1.4 image workspace and portable updater validation
on:
  push:
    branches: [codex/folio-v14-selection]
  workflow_dispatch:
concurrency:
  group: folio-v14-windows
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tests/update-windows-v13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v14-updater-smoke
          path: tests/output/v13-updater*
  windows:
    needs: updater
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pip install --target native/vendor fonttools==4.61.1
      - name: Include fontTools license
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('native/vendor')
          target = root / 'fontTools/LICENSE'
          if not target.exists():
              source = next(root.glob('fonttools-*.dist-info/**/LICENSE'))
              shutil.copyfile(source, target)
      - run: npx playwright install chromium
      - run: python scripts/restore-assets.py
      - run: python tests/image-v13.py
      - run: python tests/selection-v14.py
      - run: npm run test:unit
      - run: npm run build:win
      - run: npm run test:package
        id: package
      - run: node tests/image-v13.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/selection-v14.cjs
        timeout-minutes: 8
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v14-image-preview
          path: tests/output/v14-*.png
      - run: python tests/public-corpus-p5.py
      - run: python tests/editor-p5.py
      - run: python tests/editor-p6.py
      - run: python tests/editor-p7.py
      - run: python tests/editor-p8.py
      - run: python tests/update-windows-v13.py
      - run: python tests/editor-yearbook.py
      - run: python tests/public-corpus-p8.py
      - uses: actions/cache/restore@v4
        id: corpus-cache
        with:
          path: tests/output/p6/originals
          key: p6-public-corpus-${{ hashFiles('tests/public-corpus-p6.json') }}
      # Optional bootstrap from this repository's earlier complete download.
      # Every PDF is still checked against its pinned SHA-256 by the test.
      - uses: actions/download-artifact@v4
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: folio-p6-windows-validation
          run-id: 35808785466
          github-token: ${{ github.token }}
          path: .corpus-seed
      - name: Restore downloaded public PDFs
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          source=Path('.corpus-seed/p6/originals')
          target=Path('tests/output/p6/originals');target.mkdir(parents=True,exist_ok=True)
          for file in source.glob('*.pdf'):shutil.copyfile(file,target/file.name)
          shutil.rmtree('.corpus-seed',ignore_errors=True)
      - run: python tests/public-corpus-p6.py
      - run: python tests/public-text-p8.py
      - run: python tests/editor-p8-contracts.py
      - uses: actions/cache/save@v4
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          path: tests/output/p6/originals
          key: p6-public-corpus-${{ hashFiles('tests/public-corpus-p6.json') }}
      - run: node tests/electron-p5.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p6.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p8.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p7.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: npm test
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
      - run: node tests/electron-v12.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p4.cjs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v14-windows-validation
          path: tests/output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v14-screenshots
          path: tests/output/*-*.png
      - name: Archive tested build
        run: python scripts/archive-release.py deliverables
      - uses: actions/upload-artifact@v4
        with:
          name: folio-v14-portable
          path: deliverables/*-win-x64.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: folio-v14-source
          path: deliverables/*-source.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: folio-v14-checksums
          path: deliverables/*-SHA256.json

  release:
    if: github.ref == 'refs/heads/codex/folio-v14-selection'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ionize1080/Folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: folio-v14-*
          path: downloaded
      - name: Verify the tested binaries and publish
        run: python scripts/publish-v14.py
