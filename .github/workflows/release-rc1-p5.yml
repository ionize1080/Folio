name: Publish verified Folio 1.2 RC1-P5
on:
  push:
    branches: [codex/release-1.2-rc1-p5]
    paths: [.github/workflows/release-rc1-p5.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: folio-release-v1.2.0-rc1-p5
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ionize1080/Folio
    steps:
      - name: Download exact successful Windows build
        shell: python
        run: |
          import json,subprocess
          repo='ionize1080/Folio';run=35580362995;sha='5af7eedfef348f72e1ceaa362902e68f0a88682a'
          result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          assert result['status']=='completed' and result['conclusion']=='success'
          assert result['head_sha']==sha and result['path']=='.github/workflows/folio-editor-p5.yml'
          artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))['artifacts']
          for name in ['folio-p5-portable','folio-p5-source','folio-p5-windows-validation']:
              matches=[a for a in artifacts if a['name']==name and not a['expired']]
              assert len(matches)==1,name
              subprocess.run(['gh','run','download',str(run),'--name',name,'--dir','download/'+name],check=True)
      - name: Verify tested binaries and stage attachments
        shell: python
        run: |
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          src=Path('download');out=Path('release');out.mkdir();prefix='Folio-PDF-Studio-1.2.0-RC1-P5'
          portable=src/'folio-p5-portable'/f'{prefix}-win-x64.zip';source=src/'folio-p5-source'/f'{prefix}-source.zip'
          validation=src/'folio-p5-windows-validation'
          reports={name:json.loads((validation/file).read_text(encoding='utf-8')) for name,file in {
              'packagedEditor':'p5-electron-report.json','packagedNarrowTable':'p4-electron-report.json',
              'packagedExistingFeatures':'v12-electron-report.json','nativeEditor':'p5-native-report.json','publicCorpus':'p5-corpus-report.json'}.items()}
          for name,r in reports.items():assert not r['errors'],name
          for name in ['packagedEditor','packagedNarrowTable','packagedExistingFeatures']:assert reports[name]['platform']=='win32',name
          assert len(reports['packagedEditor']['checks'])>=4
          assert reports['publicCorpus']['pages']==23 and len(reports['publicCorpus']['documents'])==6
          with zipfile.ZipFile(portable) as z:
              assert z.testzip() is None
              for internal,field in [('Folio-PDF-Studio/resources/app.asar','asar_sha256'),('Folio-PDF-Studio/Folio.exe','exe_sha256')]:
                  with z.open(internal) as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
                  for name in ['packagedEditor','packagedNarrowTable','packagedExistingFeatures']:assert digest==reports[name][field],(name,field)
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              p=json.loads(z.read('Folio-PDF-Studio-source/package.json'))
              assert p['version']=='1.2.0' and p['releaseChannel']=='rc1-p5'
              assert 'Folio-PDF-Studio-source/docs/RC1-P5-editor-audit.md' in z.namelist()
              assert not any('/tests/output/' in n or '/.venv/' in n for n in z.namelist())
          shutil.copyfile(portable,out/f'{prefix}-portable-win-x64.zip');shutil.copyfile(source,out/source.name)
          results={'sourceCommit':'5af7eedfef348f72e1ceaa362902e68f0a88682a','windowsRun':'https://github.com/ionize1080/Folio/actions/runs/35580362995',**reports}
          (out/f'{prefix}-validation.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          hashes=[]
          for f in sorted(out.iterdir()):
              with f.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
              hashes.append(f'{digest}  {f.name}')
          (out/f'{prefix}-SHA256.txt').write_text('\n'.join(hashes)+'\n',encoding='utf-8')
          notes='''## 修复
          - 修复 PDF 内嵌中文子集字体缺少 cmap/post/OS2 引起的 Invalid font data；支持 Type1 转封装、CID CFF 字符映射与字距度量校正。
          - 修复混合粗体段落误拆、窄栏距跨栏合并、物理换行被误当作段落，以及横线表格未识别。
          - 修复空绘制指令导致整页不可编辑、保存后不能继续编辑、旋转页面命中坐标及非 BMP 字符映射。
          - 字体加载失败保留草稿并回退到原生排版；字体缓存改为原子写入；内嵌字体已覆盖的字符不再被同名系统字体替换。

          ## 验证
          118 项 JavaScript 单元测试、完整原生与界面回归、Windows 打包一致性检查通过。
          实际 Folio.exe 验证了 Chromium 字体加载、中文三次修改保存重开、90° 页面点击编辑、稀疏表格及原有书签/编辑保存功能。
          6 份公开多语言 PDF 共 23 页在 Windows 检查；另在本地检查两份中文 PDF 共 18 页，对选定编辑区域验证框外像素无变化。
          Windows 验收：https://github.com/ionize1080/Folio/actions/runs/35580362995
          源码审计与能力边界：https://github.com/ionize1080/Folio/blob/5af7eedfef348f72e1ceaa362902e68f0a88682a/docs/RC1-P5-editor-audit.md

          ## 下载
          完整解压 portable-win-x64.zip，运行 Folio.exe，无需额外安装 Python、Node 或 OCR 模型。
          source.zip 含源码与离线资源；另附 validation.json 和 SHA256.txt。
          此版本保持预发布标记。Type3、部分特殊 Type1 与非 Identity CID 字体、复杂阅读方向及特殊页面框仍有限制；推断表格固定原边界，不自动移动边框。
          '''
          Path('release-notes.md').write_text('\n'.join(line.lstrip() for line in notes.splitlines())+'\n',encoding='utf-8')
      - name: Publish source and tested portable build
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.0-rc1-p5 release/* --target 5af7eedfef348f72e1ceaa362902e68f0a88682a --title 'Folio PDF Studio 1.2.0 RC1-P5' --notes-file release-notes.md --draft --prerelease
          gh release edit v1.2.0-rc1-p5 --draft=false --prerelease
