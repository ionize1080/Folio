name: Folio 1.7.1 Windows acceptance and release
on:
  push:
    branches: [fix/smart-toc-usability]
  workflow_dispatch:
concurrency:
  group: folio-v171-windows
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: python -m unittest discover -s tests -p release_transport_test.py
      - run: npx playwright install chromium
      - run: node tests/page-calibration-ui.cjs
      - run: node tests/smart-toc-ui.cjs
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pip install --target native/vendor fonttools==4.61.1
      - name: Include fontTools license
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root=Path('native/vendor'); target=root/'fontTools/LICENSE'
          if not target.exists(): shutil.copyfile(next(root.glob('fonttools-*.dist-info/**/LICENSE')), target)
      - run: python scripts/restore-assets.py
      - run: python tests/fixture-v9.py
      - run: python tests/fixture-v10.py
      - run: python tests/fixture-v16.py
      - run: npm run build:win
      - run: npm run test:package
      - run: node tests/smart-toc-electron.cjs
        timeout-minutes: 8
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/update-health-v162.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: python scripts/archive-release.py deliverables
      - run: node tests/update-v161.cjs
        timeout-minutes: 10
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/i18n-v16.cjs
        timeout-minutes: 8
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v171-ui
          path: |
            tests/output/smart-toc-*.json
            tests/output/smart-toc-*.png
            tests/output/page-calibration-*.json
            tests/output/v16-*.json
            tests/output/v16-*.png
      - run: python tests/image-v13.py
      - run: python tests/image-v15.py
      - run: python tests/selection-v14.py
      - run: python tests/ocr-diagnostics-p2.py
      - run: python tests/editor-p7.py
      - run: python tests/editor-p8.py
      - run: python tests/editor-yearbook.py
      - run: python tests/update-windows-v13.py
      - run: node tests/image-v13.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/image-v15.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/selection-v14.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: python tests/selection-v14-saved.py
      - run: python tests/native-v11.py
      - run: node tests/electron-v12.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p7.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-v171-validation
          path: tests/output/*report.json
      - uses: actions/upload-artifact@v4
        with:
          name: folio-v171-deliverables
          path: deliverables/*
          compression-level: 0
      - name: Publish complete tested release
        run: python scripts/publish-v171.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
