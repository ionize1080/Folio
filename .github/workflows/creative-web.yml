name: Build embedded Folio editors
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [feat/creative-studio]
    paths: ['integrations/creative/**', 'scripts/*-creative.py', '.github/workflows/creative-web.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: creative-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Embedded ${{ matrix.kind }} engine
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        kind: [photo, vector]
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: .creative-web/${{ matrix.kind }}
          key: folio-wasm-${{ matrix.kind }}-${{ hashFiles('scripts/build-creative.py', 'scripts/patch-creative.py', 'integrations/creative/**', 'native/fonts/**') }}
      - name: Rust toolchain
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown && rustup default 1.95.0
      - name: Build from pinned source
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: python scripts/build-creative.py ${{ matrix.kind }}
      - name: Verify source and asset integrity
        run: python scripts/verify-creative.py ${{ matrix.kind }}
      - name: Check optional cache budget
        if: steps.engine-cache.outputs.cache-hit != 'true'
        id: cache-budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-cache.py budget creative-${{ matrix.kind }}
      - uses: actions/cache/save@v4
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.cache-budget.outputs.allowed == 'true'
        with:
          path: .creative-web/${{ matrix.kind }}
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: creative-${{ matrix.kind }}
          path: .creative-web/${{ matrix.kind }}/
          if-no-files-found: error
          retention-days: 7
