name: Back up and synchronize P6 main and Latest
on:
  push:
    branches: [codex/sync-p6-main-20260923, main]
    paths: [.github/workflows/sync-p6-main-20260923.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: folio-sync-p6-20260923
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ionize1080/Folio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation and script
        shell: bash
        run: |
          git diff --check 0b1cfa0cfb685f8d8bbd5ee04b0042574a85a8d5 HEAD
          python -m py_compile scripts/sync-p6-release.py
          python - <<'PY'
          from pathlib import Path
          import re
          files = ['README.md', 'docs/ARCHITECTURE.md', 'docs/CHANGELOG-1.2.md',
                   'docs/NEXT-RELEASE-PLAN.md', 'docs/VALIDATION.md',
                   'docs/RELEASE-P6.md', 'docs/RELEASE-SYNC-2026-09-23.md']
          for name in files:
              file = Path(name)
              for target in re.findall(r'\]\(([^)]+)\)', file.read_text()):
                  if '://' in target or target.startswith('#'):
                      continue
                  path = target.split('#')[0]
                  assert (file.parent / path).exists(), (name, target)
          print('Current documentation links verified')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:unit
      - name: Back up original releases before merging
        if: github.ref != 'refs/heads/main'
        run: python scripts/sync-p6-release.py
      - name: Verify backups and update P6 Latest on main
        if: github.ref == 'refs/heads/main'
        run: python scripts/sync-p6-release.py --promote
