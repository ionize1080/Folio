name: Folio RC1-P6 editor regression validation
on:
  push:
    branches: [codex/folio-editor-p6]
  workflow_dispatch:
concurrency:
  group: folio-editor-p6-windows
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pip install --target native/vendor fonttools==4.61.1
      - name: Include fontTools license
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('native/vendor')
          target = root / 'fontTools/LICENSE'
          if not target.exists():
              source = next(root.glob('fonttools-*.dist-info/**/LICENSE'))
              shutil.copyfile(source, target)
      - run: npx playwright install chromium
      - run: python scripts/restore-assets.py
      - run: python tests/public-corpus-p5.py
      - run: python tests/editor-p5.py
      - run: python tests/editor-p6.py
      - run: python tests/public-corpus-p6.py
      - run: npm run build:win
      - run: npm run test:package
      - run: node tests/electron-p5.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p6.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: npm test
      - run: node tests/electron-v12.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/electron-p4.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-p6-windows-validation
          path: tests/output/
      - name: Archive tested build
        run: python scripts/archive-release.py deliverables
      - uses: actions/upload-artifact@v4
        with:
          name: folio-p6-portable
          path: deliverables/*-win-x64.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: folio-p6-source
          path: deliverables/*-source.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: folio-p6-checksums
          path: deliverables/*-SHA256.json

