  creativeplacement:
    name: Artwork placement and canvas experience
    needs:
    - core
    - prepare
    - engines
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'true'
        creative: 'true'
        fixtures: 'true'
    - run: native\runtime\python.exe tests/creative-native.py
    - run: node tests/creative-ui.cjs
    - run: node tests/creative-experience.cjs
    - id: results
      run: python scripts/ci-reports.py export creativeplacement
