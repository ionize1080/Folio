name: Folio core acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:quick
  native:
    name: Native regressions ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install PyMuPDF==1.26.6 pypdf==6.10.0 pypdfium2==5.13.0 pikepdf==10.13.0.post1 fonttools==4.61.1 Pillow numpy
      - run: node scripts/acceptance.mjs native
        env:
          FOLIO_TEST_SHARD: ${{ matrix.shard }}/3

  modern:
    name: Windows modern workspace regressions
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
        with:
          ai: 'false'
          conversion: 'false'
          models: 'false'
          creative: 'false'
          fixtures: 'false'
      - run: native/runtime/python.exe tests/workflow-250-fixture.py
      - run: native/runtime/python.exe tests/page-organization.py
      - run: native/runtime/python.exe tests/creative-native.py
      - run: node tests/ribbon-280.cjs
      - run: node tests/tabs-280.cjs
      - run: node tests/modern-280.cjs
      - run: node tests/organizer-features.cjs
