name: Reader XI official origin check
on:
  push:
    branches: [qa/reader-xi-origin-20261121]
    paths: [.github/workflows/reader-xi-origin-qa.yml]
permissions: {}
jobs:
  adobe-origin:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Check official HTTPS paths
        id: probe
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          hosts = ("ardownload2.adobe.com", "ardownload.adobe.com", "ftp.adobe.com")
          versions = (("11.0.10", "AdbeRdr11010_en_US.exe"), ("11.0.00", "AdbeRdr11000_en_US.exe"))
          urls = [f"https://{host}/pub/adobe/reader/win/11.x/{version}/en_US/{name}"
                  for version, name in versions for host in hosts]

          class AdobeHTTPSRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, url):
                  parsed = urlsplit(url)
                  if parsed.scheme != "https" or not (parsed.hostname or "").endswith(".adobe.com"):
                      raise ValueError("unapproved redirect")
                  return super().redirect_request(req, fp, code, msg, hdrs, url)

          def inspect(url):
              record = {"url": url}
              for method in ("HEAD", "GET"):
                  try:
                      headers = {"Accept-Encoding": "identity"}
                      if method == "GET":
                          headers["Range"] = "bytes=0-15"
                      with build_opener(AdobeHTTPSRedirect()).open(Request(url, headers=headers, method=method), timeout=24) as resp:
                          item = {"status": resp.status, "type": resp.headers.get("Content-Type"),
                                  "length": resp.headers.get("Content-Length"), "final": resp.geturl()}
                          if method == "GET":
                              item["pe"] = resp.read(16).startswith(b"MZ")
                  except HTTPError as exc:
                      item = {"status": exc.code, "type": exc.headers.get("Content-Type"), "final": exc.geturl()}
                  except Exception as exc:
                      item = {"status": None, "failure": str(exc)}
                  record[method] = item
              return record

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              rows = list(pool.map(inspect, urls))
          for row in rows:
              print("ADOBE_HTTP " + json.dumps(row), flush=True)

          available = False
          for row in rows:
              if not row["GET"].get("pe"):
                  continue
              try:
                  dest = Path(os.environ["RUNNER_TEMP"]) / "adobe-reader-xi-origin.exe"
                  with build_opener(AdobeHTTPSRedirect()).open(row["url"], timeout=45) as resp, dest.open("wb") as out:
                      if resp.status != 200:
                          continue
                      while chunk := resp.read(1024*1024):
                          if out.tell() + len(chunk) > 112*1024*1024:
                              raise ValueError("unexpected package size")
                          out.write(chunk)
                  print("ADOBE_PACKAGE " + json.dumps({"url": row["url"], "bytes": dest.stat().st_size,
                        "sha256": hashlib.file_digest(dest.open("rb"), "sha256").hexdigest()}))
                  available = True
                  break
              except Exception as exc:
                  print("ADOBE_DOWNLOAD_ERROR " + str(exc))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("available=" + str(available).lower(), file=out)
      - name: Verify publisher and version without executing the installer
        if: steps.probe.outputs.available == 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'adobe-reader-xi-origin.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $installer
          $version = (Get-Item -LiteralPath $installer).VersionInfo
          [ordered]@{status=[string]$sig.Status;subject=$sig.SignerCertificate.Subject;product=$version.ProductName;version=$version.ProductVersion;fileVersion=$version.FileVersion} | ConvertTo-Json -Compress
          $publisher = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($sig.Status -ne 'Valid' -or $publisher -notin @('Adobe Systems, Incorporated', 'Adobe Systems Incorporated','Adobe Inc.') -or $version.ProductVersion -notmatch '^11\.0\.10\.') { throw "Authenticode or XI version mismatch: $publisher" }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'c438ac343381031cd47dd4ed966c8e86b2bcd5a1959f55c1c7d8c61920dd18bc') { throw 'Unexpected package digest' }
      - name: Install signed Reader in disposable VM
        if: steps.probe.outputs.available == 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'adobe-reader-xi-origin.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'adobe-xi-extracted'
          $proc = Start-Process -FilePath $installer -WindowStyle Hidden -ArgumentList @("-sfx_o$dest",'-sfx_ne','-sfx_nu') -Wait -PassThru
          Write-Output "ADOBE_EXTRACT $($proc.ExitCode)"
          $msi = Get-ChildItem -Path $dest -Recurse -Filter AcroRead.msi | Select-Object -First 1
          if (!$msi) { throw 'Signed installer did not extract Reader MSI' }
          $proc = Start-Process -FilePath msiexec.exe -WindowStyle Hidden -ArgumentList @('/i',('"' + $msi.FullName + '"'),'/qn','/norestart','DISABLE_ARM_SERVICE_INSTALL=1','DISABLEDESKTOPSHORTCUT=1','/L*v',('"' + "$env:RUNNER_TEMP\adobe-xi-msi.log" + '"')) -Wait -PassThru
          Write-Output "ADOBE_INSTALL $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0,3010)) { Get-Content "$env:RUNNER_TEMP\adobe-xi-msi.log" -Tail 15; throw 'Reader MSI failed' }
          $patch = Get-ChildItem -Path $dest -Recurse -Filter AdbeRdrUpd11010.msp | Select-Object -First 1
          if (!$patch) { throw 'Official 11.0.10 update was absent from the signed Adobe installer' }
          $proc = Start-Process -FilePath msiexec.exe -WindowStyle Hidden -ArgumentList @('/p',('"' + $patch.FullName + '"'),'/qn','/norestart') -Wait -PassThru
          Write-Output "ADOBE_PATCH $($patch.Name) $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0,3010)) { throw 'Reader XI bundled update failed' }
          $viewer = Get-ChildItem "C:\Program Files (x86)\Adobe" -Recurse -Filter AcroRd32.exe | Select-Object -First 1
          if (!$viewer) { $viewer=Get-ChildItem "C:\Program Files (x86)\Adobe" -Recurse -Filter AcroRd32.exe | Select-Object -First 1 }
          $sig = Get-AuthenticodeSignature $viewer.FullName
          $info=$viewer.VersionInfo
          Write-Output "ADOBE_VIEWER $($viewer.FullName) $($info.ProductVersion) $($info.FileVersion) $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $info.ProductVersion -notmatch '^11\.0\.10\.') { throw 'Unexpected viewer identity' }
          "XI_VIEWER=$($viewer.FullName)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Make public-domain GUI test control
        if: steps.probe.outputs.available == 'true'
        shell: python
        run: |
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']) / 'xi-pdf'
          root.mkdir(exist_ok=True)
          text=b'BT /F1 22 Tf 40 180 Td (FOLIO READER XI CONTROL) Tj ET\n'
          bodies=[b'<< /Type /Catalog /Pages 2 0 R >>',b'<< /Type /Pages /Count 1 /Kids [3 0 R] >>',b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 400 240] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',b'<< /Length %d >>\nstream\n'%len(text)+text+b'endstream']
          pdf=b'%PDF-1.4\n'
          offsets=[]
          for i,body in enumerate(bodies,1):
              offsets.append(len(pdf))
              pdf+=b'%d 0 obj\n'%i+body+b'\nendobj\n'
          xref=len(pdf)
          pdf+=b'xref\n0 6\n0000000000 65535 f \n'+b''.join(b'%010d 00000 n \n'%o for o in offsets)+b'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n'%xref
          (root/'no-info-original.pdf').write_bytes(pdf)
      - name: Inspect real Reader GUI without dismissing any document or first-run prompt
        if: steps.probe.outputs.available == 'true'
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,System.Windows.Forms,System.Drawing
          New-Item 'xi-gui-evidence' -ItemType Directory -Force | Out-Null
          $file=Join-Path $env:RUNNER_TEMP 'xi-pdf\no-info-original.pdf'
          Start-Process $env:XI_VIEWER -WindowStyle Normal -ArgumentList @('/n',('"' + $file + '"'))
          Start-Sleep 12
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $roots=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          Get-Process AcroRd32 -ErrorAction SilentlyContinue | Select-Object Id,SessionId,MainWindowTitle | Format-Table | Out-String | Write-Output
          foreach($r in $roots) {
            Write-Output "XI_WINDOW $($r.Current.ProcessId) $($r.Current.ClassName) $($r.Current.Name)"
            if ($r.Current.ClassName -eq '#32770' -or $r.Current.Name -match 'Adobe|FOLIO|no-info') {
              foreach($x in $r.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | Select-Object -First 180) {
                if ($x.Current.Name) { Write-Output "XI_CONTROL $($x.Current.ClassName) $($x.Current.ControlType.ProgrammaticName) $($x.Current.Name.Substring(0, [Math]::Min(180,$x.Current.Name.Length)))" }
              }
            }
          }
          $reader=$roots | Where-Object { $_.Current.ClassName -eq 'AcrobatSDIWindow' } | Select-Object -First 1
          if (!$reader) { throw 'No Reader top-level window detected' }
          $dialog=$reader.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | Where-Object { $_.Current.Name -like '*License Agreement*' -and $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
          $client=if ($dialog) { $dialog } else { $reader }
          $rect=$client.Current.BoundingRectangle
          if ($rect.Width -gt 0 -and $rect.Height -gt 0) {
            $image=New-Object Drawing.Bitmap([int]$rect.Width,[int]$rect.Height)
            $g=[Drawing.Graphics]::FromImage($image)
            $g.CopyFromScreen([int]$rect.X,[int]$rect.Y,0,0,$image.Size)
            $g.Dispose()
            $image.Save((Join-Path $PWD 'xi-gui-evidence\reader-first-screen.png'))
            $image.Dispose()
          }
          @{reader=$reader.Current.Name;dialog=if($dialog){$dialog.Current.Name}else{$null};product=(Get-Item $env:XI_VIEWER).VersionInfo.ProductVersion;documentVerified=$false} | ConvertTo-Json | Set-Content -Encoding UTF8 'xi-gui-evidence\observed.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-first-screen-diagnostics
          path: xi-gui-evidence/
          retention-days: 5
