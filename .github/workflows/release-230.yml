name: Folio 2.3.0 parallel verified Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: folio-230-release
  cancel-in-progress: true
jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the intended public main branch
        env:
          PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$PUBLIC_REPOSITORY" = true
      - run: npm ci --ignore-scripts
      - run: npm run test:quick
      - run: python tests/ci-reports.py
  prepare:
    name: Prepare reusable dependencies
    needs: core
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
        with:
          ai: 'true'
          fixtures: 'false'
          save-cache: 'true'
  documents:
    name: Documents and native engines
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
      - run: node scripts/acceptance.mjs native
      - run: node tests/web-pdf.cjs && python tests/document-utilities.py && node tests/document-tools-ui.cjs
      - run: native\runtime\python.exe tests/conversion-native.py && native\runtime\python.exe tests/engineering-native.py && native\runtime\python.exe tests/conversion-public.py
      - run: node tests/workbench-ui.cjs && node tests/engineering-ui.cjs && node tests/conversion-scan.cjs
      - id: results
        run: python scripts/ci-reports.py export documents
  integration:
    name: MCP and UI integration
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
        with:
          ai: 'true'
      - name: Prepare isolated MCP regression environment
        run: python -m venv .venv-ai && .venv-ai\Scripts\python.exe -m pip install -r integrations/pdf-mcp-requirements.lock.txt pytest pytest-cov && .venv-ai\Scripts\python.exe -m pip install --no-deps integrations/pdf-mcp-upstream
      - name: Full upstream MCP regression and coverage
        shell: pwsh
        run: |
          $env:PATH="$PWD\.ai-runtime\pdf-runtime\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX="$PWD\.ai-runtime\pdf-runtime\tesseract\tessdata"
          .venv-ai\Scripts\python.exe -m pytest integrations/pdf-mcp-upstream/tests -q
          exit $LASTEXITCODE
      - run: node tests/chatbox-completion-220.cjs && node tests/graphics-220.cjs && node tests/ai-settings.cjs && node tests/chrome-202.cjs
      - run: node tests/ai-integration.cjs && node tests/ai-hosted.cjs && node tests/pdf-mcp-bridge.cjs
      - id: results
        run: python scripts/ci-reports.py export integration
  live:
    name: Real AI scenarios
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
        with:
          ai: 'true'
      - name: Real metadata, Office conversion and same-chat context
        run: node tests/document-live.cjs && node tests/conversion-live.cjs && node tests/context-live.cjs
        timeout-minutes: 12
        env:
          FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
          FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
      - name: Real document editing workflows
        run: node tests/ai-live-202.cjs
        timeout-minutes: 15
        env:
          FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
          FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
      - name: Real concurrent image generation
        run: node tests/graphics-live-220.cjs && python tests/graphics-live-220.py
        timeout-minutes: 12
        env:
          FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
          FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
          FOLIO_IMAGE_API_KEY: ${{ secrets.FOLIO_IMAGE_API_KEY }}
      - id: results
        run: python scripts/ci-reports.py export live
  release:
    name: Verify final package and publish
    needs: [core, documents, integration, live]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-workbench
        with:
          ai: 'true'
      - name: Verify document reports belong to this commit and run
        run: python scripts/ci-reports.py import documents
        env:
          FOLIO_CI_REPORTS: ${{ needs.documents.outputs.reports }}
      - name: Verify integration reports belong to this commit and run
        run: python scripts/ci-reports.py import integration
        env:
          FOLIO_CI_REPORTS: ${{ needs.integration.outputs.reports }}
      - name: Verify live AI reports belong to this commit and run
        run: python scripts/ci-reports.py import live
        env:
          FOLIO_CI_REPORTS: ${{ needs.live.outputs.reports }}
      - run: python tests/update-python-201.py && npm run build:win && npm run test:package
      - name: Packaged workspace and graphics
        run: node tests/workspace-210.cjs && node tests/graphics-220.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - name: Packaged conversion, fonts and structure
        run: node tests/workbench-ui.cjs && node tests/engineering-ui.cjs && node tests/conversion-scan.cjs
        timeout-minutes: 15
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: node tests/package-ai.cjs
      - run: node tests/update-health-v162.cjs
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
      - run: python scripts/archive-release.py deliverables
      - name: Validate exact release ZIP updater
        run: node tests/update-201.cjs
        timeout-minutes: 12
        env:
          FOLIO_EXE: ${{ github.workspace }}\dist\Folio-PDF-Studio-win-x64\Folio.exe
          FOLIO_UPDATE_ZIP: ${{ github.workspace }}\deliverables\Folio-PDF-Studio-2.3.0-portable-win-x64.zip
      - name: Publish only verified artifacts
        run: python scripts/publish-230-ci.py
        env:
          GH_TOKEN: ${{ github.token }}
