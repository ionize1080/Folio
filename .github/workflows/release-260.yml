name: Folio 2.6.0 parallel verified Windows release
# Use native hidden-window capture while retaining all layout and interaction assertions.
'on':
  workflow_dispatch: null
  push:
    branches: [main]
    paths: [".github/workflows/release-260.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: folio-260-release
  cancel-in-progress: true
jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require the intended public main branch
      env:
        PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
      run: test "$GITHUB_REF" = refs/heads/main && test "$PUBLIC_REPOSITORY" = true
    - run: npm ci --ignore-scripts
    - run: npm run test:quick
    - run: python tests/ci-reports.py
    - run: python tests/release-251-checks.py
    - run: python tests/release-260-checks.py
  prepare:
    name: Prepare reusable dependencies
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        fixtures: 'false'
        save-cache: 'true'
  engines:
    name: Build embedded engines
    uses: ./.github/workflows/creative-web.yml
  native1:
    name: Native engine regressions 1/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 1/6
    - id: results
      run: python scripts/ci-reports.py export native1
  native2:
    name: Native engine regressions 2/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 2/6
    - id: results
      run: python scripts/ci-reports.py export native2
  native3:
    name: Native engine regressions 3/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 3/6
    - id: results
      run: python scripts/ci-reports.py export native3
  native4:
    name: Native engine regressions 4/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 4/6
    - id: results
      run: python scripts/ci-reports.py export native4
  native5:
    name: Native engine regressions 5/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 5/6
    - id: results
      run: python scripts/ci-reports.py export native5
  native6:
    name: Native engine regressions 6/6
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: node scripts/acceptance.mjs native
      env:
        FOLIO_TEST_SHARD: 6/6
    - id: results
      run: python scripts/ci-reports.py export native6
  docengine:
    name: Office, document structure and conformance
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'true'
        models: 'true'
        creative: 'false'
        fixtures: 'true'
    - run: native\runtime\python.exe tests/conversion-native.py
    - run: native\runtime\python.exe tests/engineering-native.py
    - run: native\runtime\python.exe tests/conversion-public.py
    - id: results
      run: python scripts/ci-reports.py export docengine
  docui:
    name: Document conversion user interfaces
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'true'
        models: 'true'
        creative: 'false'
        fixtures: 'true'
    - run: node tests/web-pdf.cjs
    - run: python tests/document-utilities.py
    - run: node tests/document-tools-ui.cjs
    - run: native\runtime\python.exe tests/engineering-native.py
    - run: node tests/workbench-ui.cjs
    - run: node tests/engineering-ui.cjs
    - run: node tests/conversion-scan.cjs
    - run: node tests/export-review-251.cjs
    - id: results
      run: python scripts/ci-reports.py export docui
  mcp:
    name: MCP regression (two workers)
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        fixtures: 'false'
    - run: if not exist tests\output mkdir tests\output
    - name: Prepare isolated MCP regression environment
      run: python -m venv .venv-ai && .venv-ai\Scripts\python.exe -m pip install -r integrations/pdf-mcp-requirements.lock.txt pytest==9.2.0 pytest-cov==7.1.0 pytest-xdist==3.8.0 &&
        .venv-ai\Scripts\python.exe -m pip install --no-deps integrations/pdf-mcp-upstream
    - name: Two-worker upstream MCP regression and merged coverage
      shell: pwsh
      run: '$env:PATH="$PWD\.ai-runtime\pdf-runtime\tesseract;$env:PATH"

        $env:TESSDATA_PREFIX="$PWD\.ai-runtime\pdf-runtime\tesseract\tessdata"

        .venv-ai\Scripts\python.exe -m pytest integrations/pdf-mcp-upstream/tests -p scripts.mcp_test_isolation -q -n 2 --dist loadscope --max-worker-restart=0 --cov-config=integrations/pdf-mcp-upstream/pyproject.toml
        --junitxml=tests/output/mcp-junit.xml --cov-report=json:tests/output/mcp-coverage.json --durations=12

        if ($LASTEXITCODE) {exit $LASTEXITCODE}

        python scripts/ci-mcp-report.py

        exit $LASTEXITCODE

        '
    - id: results
      run: python scripts/ci-reports.py export mcp
  ui:
    name: Shared AI interface and compact application chrome
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'true'
    - run: node tests/chatbox-completion-220.cjs
    - run: node tests/graphics-220.cjs
    - run: node tests/ai-settings.cjs
    - run: node tests/chrome-202.cjs
    - name: Browser editing, bookmarks and navigation regressions
      shell: pwsh
      run: |
        $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
        if (!(Test-Path -LiteralPath $chrome)) { throw 'The Windows runner must provide Google Chrome' }
        $env:FOLIO_CHROMIUM = $chrome
        node scripts/acceptance.mjs browser
        exit $LASTEXITCODE
    - id: results
      run: python scripts/ci-reports.py export ui
  ai:
    name: MCP transport and hosted AI integration
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'true'
    - run: node tests/ai-integration.cjs
    - run: node tests/ai-hosted.cjs
    - run: node tests/pdf-mcp-bridge.cjs
    - id: results
      run: python scripts/ci-reports.py export ai
  creative:
    name: Native artwork commands, canvas and reference alignment
    needs:
    - core
    - prepare
    - engines
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'true'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/creative-native.py
    - run: node tests/creative-engines.cjs
    - run: node tests/creative-embedded.cjs
    - id: results
      run: python scripts/ci-reports.py export creative
  creativeui:
    name: Artwork placement, interface and Office exports
    needs:
    - core
    - prepare
    - engines
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'true'
        creative: 'true'
        fixtures: 'true'
    - run: native\runtime\python.exe tests/creative-native.py
    - run: native\runtime\python.exe tests/workflow-250-fixture.py && node tests/refinements-251.cjs && node tests/close-251.cjs && node tests/design-251.cjs
    - run: node tests/creative-ui.cjs
    - run: node tests/creative-experience.cjs
    - run: native\runtime\python.exe tests/page-organization.py && node tests/organizer-ui.cjs
    - id: results
      run: python scripts/ci-reports.py export creativeui
  creativelive:
    name: Real Qwen artwork and page organization
    needs: [core, prepare, engines]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'true'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/creative-native.py
    - run: node tests/creative-live.cjs
      env:
        FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
        FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
    - id: results
      run: python scripts/ci-reports.py export creativelive
  livecontext:
    name: Real Qwen metadata, Office and same-chat context
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'true'
        models: 'true'
        creative: 'false'
        fixtures: 'true'
    - run: native\runtime\python.exe tests/engineering-native.py
      env: &id001
        FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
        FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
    - run: node tests/document-live.cjs
      env: *id001
    - run: node tests/conversion-live.cjs
      env: *id001
    - run: node tests/context-live.cjs
      env: *id001
    - run: native\runtime\python.exe tests/workflow-250-fixture.py
    - run: node tests/workflow-250.cjs --live
      env: *id001
    - run: native\runtime\python.exe tests/workflow-250-verify.py --live
    - id: results
      run: python scripts/ci-reports.py export livecontext
  liveedit:
    name: Real AI document editing workflows
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'true'
        creative: 'false'
        fixtures: 'true'
    - run: node tests/ai-live-202.cjs
      env: *id001
    - id: results
      run: python scripts/ci-reports.py export liveedit
  liveimage:
    name: Real concurrent image generation
    needs:
    - core
    - prepare
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'true'
    - run: node tests/graphics-live-220.cjs
      env: &id002
        FOLIO_QWEN_API_KEY: ${{ secrets.FOLIO_QWEN_API_KEY }}
        FOLIO_QWEN_API_URL: ${{ secrets.FOLIO_QWEN_API_URL }}
        FOLIO_IMAGE_API_KEY: ${{ secrets.FOLIO_IMAGE_API_KEY }}
    - run: node tests/image-provider-settings.cjs --live
      env: *id002
    - run: python tests/graphics-live-220.py
      env: *id002
    - id: results
      run: python scripts/ci-reports.py export liveimage
  workflow:
    name: Editing, blank pages and provider settings
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/workflow-250-fixture.py
    - run: node tests/workflow-250.cjs
    - run: native\runtime\python.exe tests/workflow-250-verify.py
    - run: node tests/image-provider-settings.cjs
    - run: node tests/organizer-geometry.cjs
    - run: native\runtime\python.exe tests/image-studio-geometry.py
    - run: node tests/image-studio-ui.cjs
    - run: native\runtime\python.exe tests/pdf-loading-fixtures.py
    # windows-latest supplies Google Chrome; the test launches its own headless
    # instance and records the version in the commit-bound workflow report.
    - name: Verify JPX edit backgrounds and thumbnails in Chrome
      run: node tests/pdf-loading.cjs
    - id: results
      run: python scripts/ci-reports.py export workflow
  editing1:
    name: Public editing corpus 1/4
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/editing-260-public.py --shard 1
    - id: results
      run: python scripts/ci-reports.py export editing1
  editing2:
    name: Public editing corpus 2/4
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/editing-260-public.py --shard 2
    - id: results
      run: python scripts/ci-reports.py export editing2
  editing3:
    name: Public editing corpus 3/4
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/editing-260-public.py --shard 3
    - id: results
      run: python scripts/ci-reports.py export editing3
  editing4:
    name: Public editing corpus 4/4
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/editing-260-public.py --shard 4
    - id: results
      run: python scripts/ci-reports.py export editing4
  editingui:
    name: Paragraph editing UI and font isolation
    needs: [core, prepare]
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      reports: ${{ steps.results.outputs.reports }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'false'
        conversion: 'false'
        models: 'false'
        creative: 'false'
        fixtures: 'false'
    - run: native\runtime\python.exe tests/editing-260-native.py
    - run: node tests/editing-260-ui.cjs
    - id: results
      run: python scripts/ci-reports.py export editingui
  release:
    name: Verify final package and publish
    needs:
    - core
    - engines
    - native1
    - native2
    - native3
    - native4
    - native5
    - native6
    - editing1
    - editing2
    - editing3
    - editing4
    - editingui
    - docengine
    - docui
    - mcp
    - ui
    - ai
    - creative
    - creativeui
    - creativelive
    - livecontext
    - liveedit
    - liveimage
    - workflow
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-workbench
      with:
        ai: 'true'
        creative: 'true'
    - name: Verify workflow regression provenance
      run: python scripts/ci-reports.py import workflow
      env:
        FOLIO_CI_REPORTS: ${{ needs.workflow.outputs.reports }}
    - name: Verify native4 test provenance
      run: python scripts/ci-reports.py import native4
      env:
        FOLIO_CI_REPORTS: ${{ needs.native4.outputs.reports }}
    - name: Verify native5 test provenance
      run: python scripts/ci-reports.py import native5
      env:
        FOLIO_CI_REPORTS: ${{ needs.native5.outputs.reports }}
    - name: Verify native6 test provenance
      run: python scripts/ci-reports.py import native6
      env:
        FOLIO_CI_REPORTS: ${{ needs.native6.outputs.reports }}
    - name: Verify editing1 test provenance
      run: python scripts/ci-reports.py import editing1
      env:
        FOLIO_CI_REPORTS: ${{ needs.editing1.outputs.reports }}
    - name: Verify editing2 test provenance
      run: python scripts/ci-reports.py import editing2
      env:
        FOLIO_CI_REPORTS: ${{ needs.editing2.outputs.reports }}
    - name: Verify editing3 test provenance
      run: python scripts/ci-reports.py import editing3
      env:
        FOLIO_CI_REPORTS: ${{ needs.editing3.outputs.reports }}
    - name: Verify editing4 test provenance
      run: python scripts/ci-reports.py import editing4
      env:
        FOLIO_CI_REPORTS: ${{ needs.editing4.outputs.reports }}
    - name: Verify editingui test provenance
      run: python scripts/ci-reports.py import editingui
      env:
        FOLIO_CI_REPORTS: ${{ needs.editingui.outputs.reports }}
    - name: Verify native1 test provenance
      run: python scripts/ci-reports.py import native1
      env:
        FOLIO_CI_REPORTS: ${{ needs.native1.outputs.reports }}
    - name: Verify native2 test provenance
      run: python scripts/ci-reports.py import native2
      env:
